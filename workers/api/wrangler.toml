name = "pulseflare-api"
account_id = "f456997005771d4af03fa8f845a54f62"
main = "src/index.ts"
compatibility_date = "2026-05-06"

[[d1_databases]]
binding = "DB"
database_name = "pulseflare"
database_id = "3136547a-66dd-484b-b931-06f04564f635"
migrations_dir = "../../migrations"

[vars]
ALLOWED_ORIGIN = "https://pulseflare.zlv.uk,https://pulseflare-zlv.pages.dev"
CLERK_AUTHORIZED_PARTIES = "https://pulseflare.zlv.uk,https://pulseflare-zlv.pages.dev,http://localhost:5173,http://localhost:4173"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[queues.producers]]
binding = "ALERT_QUEUE"
queue = "alert-events"

[[queues.producers]]
binding = "INCIDENT_QUEUE"
queue = "incident-events"

[ai]
binding = "AI"
