name = "pulseflare-api"
main = "src/index.ts"
compatibility_date = "2026-05-06"

[[d1_databases]]
binding = "DB"
database_name = "pulseflare"
database_id = "8c45da35-ca25-449d-b336-3fe2f96efb49"
migrations_dir = "../../migrations"

[[kv_namespaces]]
binding = "STATUS_KV"
id = "b5a81e5554bd4386b77f018c6d34a972"

[vars]
ALLOWED_ORIGIN = "https://pulseflare.pages.dev"
CLERK_AUTHORIZED_PARTIES = "https://pulseflare.pages.dev,http://localhost:5173,http://localhost:4173"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[queues.producers]]
binding = "ALERT_QUEUE"
queue = "alert-events"

[[queues.producers]]
binding = "INCIDENT_QUEUE"
queue = "incident-events"

[[r2_buckets]]
binding = "ARCHIVE_BUCKET"
bucket_name = "pulseflare-archive"
